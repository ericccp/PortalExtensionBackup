<div class="tab-filter-container" ng-init="c.init()">
  <div class="asset-toolbar" ng-if="c.view !== 'mobile'">

    <div class="sort-container section-spacing">
      <div class="asset-hub-my-list-sort-by-widget-container">
        <sp-widget widget="c.data.assetSortByWidget"></sp-widget>
      </div>
    </div>

    <!-- default format below -->
    <div class="asset-search-control">
      <input class="search-input-container" placeholder="${Search by keyword}" ng-model="searchText"
        ng-keydown="c.search(searchText, $event)" ng-change="c.toggleSearchIconVisibility()">
      <button class="fa fa-search search-icon" ng-if="isSearchIconVisible" ng-click="c.search(searchText)"
        aria-label="${Search}"></button>
      <button class="fa fa-times cross-icon" ng-if="!isSearchIconVisible" ng-click="c.resetSearch()"
        aria-label="${Reset}"></button>
    </div>
    <div class="skip-level-toggle-container" ng-if="c.data.assetSkipLevelToggleWidget">
      <sp-widget widget="c.data.assetSkipLevelToggleWidget"></sp-widget>
    </div>
    <div class="view-controls" ng-if="c.view !== 'mobile'">
      <div class="pull-right padder-t-sm text-lg toggle" role="group" aria-label="${Select a view}">
        <button id="tab-card" class="fa fa-th btn" ng-click="c.changeView('card')" ng-keydown="c.switchTab($event)"
          ng-class="c.data.view == 'card' ? 'btn-primary' : 'btn-default'" title="${Card View}" data-placement="top"
          data-container="body" aria-label="${Card View}" aria-pressed="{{c.data.view == 'card'}}">
        </button>
        <button id="tab-list" class="fa fa-list-ul btn" ng-click="c.changeView('list')" ng-keydown="c.switchTab($event)"
          ng-class="c.data.view == 'list' ? 'btn-primary' : 'btn-default '" title="${List View}" data-placement="top"
          data-container="body" aria-label="${List View}" aria-pressed="{{c.data.view == 'list'}}">
        </button>
      </div>
    </div>
    <div class="export-controls" ng-if="c.data.assetExportEnabled">
      <button type="button" class="btn btn-default" ng-click="c.exportAssets()"
        ng-disabled="c.isExporting" ng-attr-aria-busy="{{!!c.isExporting}}" title="${Export assets as CSV}">
        <i class="fa fa-download" aria-hidden="true"></i>
        <span>${Export}</span>
      </button>
    </div>
  </div>
  <div class="tab-filter-content" ng-class="{'tab-filter-content-mobile': c.view === 'mobile'}"
    ng-if="!isTabSwitching && !c.data.hideFilters && c.filtersData.length > 0">
    <div>
      <div ng-include="'ec-asset-filter-mobile-v2'" ng-if="c.view === 'mobile'"></div>
      <div ng-include="'ec-asset-filter-desktop-v2'" ng-if="c.view === 'desktop'"></div>
      <div class="modal fade modal-flyout" id="ec-flyout-filter-modal">
        <div class="modal-dialog modal-lg" ng-if="c.toggleFlyout">
          <div class="flyout-template-container" ng-include="'ec-asset-filter-flyout-v2'"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Org tree for the people category, shared by the desktop dropdown, flyout and mobile modal.
     Expects fc (the category), treeMobile (true where Apply/Clear are modal-wide) and treePrefix
     (unique per view, for input ids) in scope. The link function sets each checkbox's indeterminate state. -->
<script type="text/ng-template" id="ec-asset-org-tree-v2">
  <div class="org-tree" ng-if="c.orgTree">
    <div class="org-tree-all">
      <span class="filter-style">
        <input type="checkbox" id="{{treePrefix}}-org-all" data-org-value="__all__"
          ng-checked="c.getOrgState(fc.filters) === 'true'" ng-click="c.toggleOrgNode(fc, null, treeMobile)">
        <label for="{{treePrefix}}-org-all">{{::c.data.text.everyoneLabel}}</label>
      </span>
    </div>
    <ul class="org-tree-list" aria-label="{{fc.category}}">
      <li class="org-tree-row" ng-repeat="node in c.orgTree.rows track by node.value" ng-if="c.isOrgRowVisible(node)"
        ng-style="{'padding-left': (node.depth * 28) + 'px'}">
        <button type="button" class="org-tree-toggle" ng-if="node.children.length" ng-click="c.toggleOrgExpanded(node)"
          aria-expanded="{{node.expanded}}"
          aria-label="{{(node.expanded ? c.data.text.collapseLabel : c.data.text.expandLabel) + ' ' + node.label}}">
          <i class="fa" ng-class="node.expanded ? 'fa-angle-down' : 'fa-angle-right'" aria-hidden="true"></i>
        </button>
        <span class="org-tree-toggle-spacer" ng-if="!node.children.length" aria-hidden="true"></span>
        <span class="filter-style org-tree-check">
          <input type="checkbox" id="{{treePrefix}}-org-{{node.value}}" data-org-value="{{node.value}}"
            ng-checked="c.getOrgState(node.subtree) === 'true'" ng-click="c.toggleOrgNode(fc, node, treeMobile)">
          <label for="{{treePrefix}}-org-{{node.value}}">{{node.label}}<span class="org-tree-you" ng-if="node.value === c.data.currentUserId"> {{::c.data.text.youSuffix}}</span></label>
        </span>
      </li>
    </ul>
  </div>
</script>

<div ng-show="c.filterPills.length" class="pills-container-separator" ng-if="!c.data.hideFilters"></div>
<div class="filter-pills-container" ng-class="{'mobile-margin-style': c.view === 'mobile'}"
  ng-show="c.filterPills.length">
  <div
    class="{{ c.view === 'mobile' && c.filterPillsHeight > 80 && c.showMoreLessButtons ? 'filter-pills-height' : '' }} filter-pill-display-flex"
    id="filter-pills-group" role="group" aria-label="${Currently filtered by}">
    <!-- Applied Filters -->
    <div ng-repeat="pill in c.filterPills">
      <div class="pill rounded">
        <span ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{pill.label}}" class="pill-text"> {{pill.label}}
        </span>
        <button ng-click="c.clearPill(pill)" class="pill-button" aria-label="{{pill.clearLabel}}"
          ng-keydown="c.focusFilter($event, pill)">
          <i class="fa fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <button ng-if="c.view === 'desktop'" class="btn btn-link btn-sm" ng-click="c.clearAllPills()"
      aria-label="${Clear applied filters}" ng-keydown="c.focusFilter($event)">${Clear all}</button>
  </div>
  <div ng-if="c.view === 'mobile'"
    class="filter-pill-actions display-flex {{c.filterPillsHeight <= 80 ? 'flex-end': 'space-between'}}">
    <button ng-click="c.showMoreLessButtons=false" ng-if="c.filterPillsHeight > 80 && c.showMoreLessButtons"
      class="btn btn-link" aria-label="${Show more}">${Show more}</button>
    <button ng-click="c.showMoreLessButtons=true" ng-if="c.filterPillsHeight > 80 && !c.showMoreLessButtons"
      class="btn btn-link" aria-label="${Show less}">${Show less}</button>
    <button class="btn btn-link" ng-click="c.clearAllPills()" aria-label="${Clear applied filters}"
      ng-keydown="c.focusFilter($event)">${Clear all}</button>
  </div>
</div>

<div class="asset-toolbar-mobile" ng-if="c.view === 'mobile'">
  <div class="asset-hub-my-list-sort-by-widget-container">
    <sp-widget widget="c.data.assetSortByWidget"></sp-widget>
  </div>
  <div class="asset-search-control">
    <input class="search-input-container" placeholder="${Search by keyword}" ng-model="searchText"
      ng-change="c.toggleSearchIconVisibility()" ng-keydown="c.search(searchText, $event)">
    <button class="fa fa-search search-icon" ng-if="isSearchIconVisible" ng-click="c.search(searchText)"
      aria-label="${Search}"></button>
    <button class="fa fa-times cross-icon" ng-if="!isSearchIconVisible" ng-click="c.resetSearch()"
      aria-label="${Reset}"></button>
  </div>
</div>
